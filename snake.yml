name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # otomatis tiap 12 jam
  workflow_dispatch:           # tombol "Run workflow" manual
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00f0ff&color_dots=#1a1033,#3b1a5a,#7b2d8e,#ff2a6d,#ff7aa2

      - name: Push ke branch output
        uses: crazy-max/ghaction-github-pages@v3.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
